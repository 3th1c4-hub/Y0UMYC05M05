<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared Private Home</title>
<style>
    /* --- 컬러 테마 변수 --- */
    :root {
        /* 기본: Dark Space 테마 */
        --bg-color: #0b0f19;
        --card-bg: #1a202c;
        --text-main: #e2e8f0;
        --text-muted: #a0aec0;
        --accent: #3182ce;
        --border-color: #2d3748;
    }
    [data-theme="light-candy"] {
        /* 원본 GIF 느낌의 Light 테마 */
        --bg-color: #f4f5f7;
        --card-bg: #ffffff;
        --text-main: #2d3748;
        --text-muted: #718096;
        --accent: #ed8936;
        --border-color: #e2e8f0;
    }
    [data-theme="hacker"] {
        /* 해커/터미널 테마 */
        --bg-color: #000000;
        --card-bg: #0a0a0a;
        --text-main: #00ff00;
        --text-muted: #008800;
        --accent: #00aa00;
        --border-color: #004400;
    }

    /* --- 기본 스타일 --- */
    body { margin: 0; padding: 20px; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background: var(--bg-color); color: var(--text-main); transition: all 0.3s ease; }
    button, input, textarea, select { font-family: inherit; }
    .btn { padding: 8px 15px; background: var(--accent); color: #fff; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; font-weight: bold; }
    .btn:hover { opacity: 0.8; }
    .btn-small { padding: 5px 10px; font-size: 12px; cursor: pointer; border-radius: 3px; border: 1px solid var(--border-color); background: transparent; color: var(--text-main); }
    .btn-small:hover { background: var(--border-color); }
    .input-box { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid var(--border-color); border-radius: 5px; background: var(--bg-color); color: var(--text-main); box-sizing: border-box; }
    
    /* 관리자 전용 요소 숨김 처리 */
    .admin-only { display: none; }

    /* --- 인트로 화면 (1) --- */
    #intro-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #000; color: #0f0; font-family: monospace; font-size: 1.2rem;
        z-index: 9999; display: flex; flex-direction: column; justify-content: center; padding: 10%; box-sizing: border-box; cursor: pointer;
    }
    #typing-text { white-space: pre-wrap; line-height: 1.5; }
    .cursor { display: inline-block; width: 10px; height: 1em; background: #0f0; animation: blink 1s step-end infinite; vertical-align: bottom; }
    @keyframes blink { 50% { opacity: 0; } }

    /* --- 메인 대시보드 --- */
    #dashboard { max-width: 1000px; margin: 0 auto; display: none; flex-direction: column; gap: 20px; }
    
    .header-widget { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
    
    .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    
    /* 메인 이미지 배너 (4) */
    #main-banner { height: 250px; border-radius: 15px; background-size: cover; background-position: center; position: relative; border: 1px solid var(--border-color); }
    .banner-overlay { position: absolute; top: 10px; right: 10px; }

    /* 테마 선택기 (5) */
    .theme-selector { padding: 5px; border-radius: 5px; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); }

    /* 게시판 */
    .post-list { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
    .post-item { border: 1px solid var(--border-color); padding: 15px; border-radius: 10px; display: flex; gap: 15px; align-items: flex-start; background: var(--bg-color); }
    .post-thumb { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--card-bg); border: 1px solid var(--border-color); }
    .post-content { flex: 1; min-width: 0; }
    .post-title { margin: 0 0 5px 0; font-size: 1.1rem; word-break: break-all; }
    .post-date { font-size: 12px; color: var(--text-muted); margin: 0 0 10px 0; }
    .post-body { margin: 0; font-size: 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
    .post-actions { display: flex; gap: 5px; flex-shrink: 0; }

    /* --- 큰 창 글쓰기 (2) --- */
    #write-screen { max-width: 1000px; margin: 0 auto; display: none; flex-direction: column; gap: 15px; height: 90vh; }
    .editor-wrapper { display: flex; flex-direction: column; gap: 10px; flex: 1; background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid var(--border-color); }
    #post-body-input { flex: 1; resize: none; font-size: 1rem; line-height: 1.6; padding: 15px; }

    /* --- 모달 (비밀번호 입력 등) --- */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 15px; width: 350px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
</style>
</head>
<body data-theme="dark-space">

<div id="intro-screen" onclick="skipIntro()">
    <div><span id="typing-text"></span><span class="cursor"></span></div>
    <div style="margin-top: 30px; font-size: 0.8rem; color: #555;">[클릭하여 스킵]</div>
</div>

<div id="dashboard">
    <div class="header-widget">
        <div>
            <h2 style="margin:0;">Resonance Status: <span style="color:var(--accent)">Stable</span></h2>
            <p style="margin: 5px 0 0 0; color: var(--text-muted);">Access Level: <span id="access-level-text">Guest (Read Only)</span></p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <select class="theme-selector" onchange="changeTheme(this.value)">
                <option value="dark-space">Dark Space (기본)</option>
                <option value="light-candy">Light Candy (GIF)</option>
                <option value="hacker">Terminal</option>
            </select>
            <button class="btn" id="login-btn" onclick="openAuthModal('login')">🔑 관리자 로그인</button>
            <button class="btn admin-only" onclick="logout()" style="background: #c53030;">로그아웃</button>
            <button class="btn admin-only" onclick="openAuthModal('changePw')" style="background: #4a5568;">비번 변경</button>
        </div>
    </div>

    <div id="main-banner" style="background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1000&q=80');">
        <div class="banner-overlay admin-only">
            <button class="btn-small" style="background: rgba(0,0,0,0.6); color: white; border: 1px solid #fff;" onclick="changeMainImagePrompt()">이미지 링크 변경</button>
        </div>
    </div>

    <div class="tools-grid">
        <div class="card">
            <h3 style="margin-top:0;">🎵 Theme BGM</h3>
            <p id="bgm-title" style="font-size: 14px; color: var(--text-muted);">Atmospheric Space.mp3</p>
            <audio id="bgm-player" controls loop style="width: 100%;">
                <source src="https://cdn.pixabay.com/download/audio/2022/02/07/audio_c6f2a893c5.mp3?filename=space-atmospheric-background-11484.mp3" type="audio/mpeg">
                오디오 지원 불가
            </audio>
        </div>
        
        <div class="card">
            <h3 style="margin-top:0;">👥 Synchronized Users</h3>
            <p style="margin-bottom: 5px;">User 1 | User 2 | User 3</p>
            <p style="font-size: 12px; color: var(--text-muted);">* 로그인 시 모든 관리 권한이 활성화됩니다.</p>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin:0;">📝 Shared Logs</h3>
            <button class="btn admin-only" onclick="openWriteScreen()">새 글 작성</button>
        </div>
        <div id="post-container" class="post-list">
            </div>
    </div>
</div>

<div id="write-screen">
    <div class="header-widget">
        <h2 style="margin:0;" id="write-title">새 로그 작성</h2>
        <button class="btn" style="background: var(--text-muted);" onclick="closeWriteScreen()">돌아가기</button>
    </div>
    <div class="editor-wrapper">
        <input type="hidden" id="post-id">
        <input type="text" id="post-title-input" class="input-box" placeholder="제목을 입력하세요" style="font-size: 1.2rem; font-weight: bold;">
        
        <label style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">대표 이미지 (URL 또는 PC에서 선택)</label>
        <div style="display: flex; gap: 10px;">
            <input type="file" id="post-image-file" accept="image/*" onchange="previewImage(event)" class="input-box" style="flex: 1;">
            <input type="text" id="post-image-url" class="input-box" placeholder="또는 이미지 URL 직접 붙여넣기" style="flex: 2;" onchange="document.getElementById('post-image-data').value = this.value;">
        </div>
        <input type="hidden" id="post-image-data">
        
        <textarea id="post-body-input" class="input-box" placeholder="내용을 기록하세요..."></textarea>
        
        <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
            <button class="btn" style="padding: 12px 30px; font-size: 1.1rem;" onclick="savePost()">💾 저장 및 업로드</button>
        </div>
    </div>
</div>

<div id="authModal" class="modal">
    <div class="modal-content">
        <h3 id="auth-modal-title" style="margin:0;">권한 인증</h3>
        <p id="auth-modal-desc" style="font-size: 12px; color: var(--text-muted); margin:0;">마스터 비밀번호를 입력하세요.</p>
        <input type="password" id="auth-pw-input" class="input-box" placeholder="비밀번호">
        
        <input type="password" id="auth-new-pw-input" class="input-box" placeholder="새로운 비밀번호" style="display: none;">

        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn" style="flex: 1;" onclick="executeAuth()">확인</button>
            <button class="btn" style="flex: 1; background: var(--text-muted);" onclick="closeModal('authModal')">취소</button>
        </div>
    </div>
</div>

<script>
    // --- 초기 설정 및 로컬 데이터 로드 ---
    if(!localStorage.getItem('masterPw')) localStorage.setItem('masterPw', '1234'); // 초기 비밀번호: 1234
    
    let posts = JSON.parse(localStorage.getItem('sharedPosts')) || [];
    let isLoggedIn = sessionStorage.getItem('isAdmin') === 'true'; // 세션 유지 (새로고침해도 로그인 유지)
    let currentAuthAction = ''; // 'login' 또는 'changePw'

    // 테마 및 메인 이미지 초기화
    const savedTheme = localStorage.getItem('siteTheme') || 'dark-space';
    document.body.setAttribute('data-theme', savedTheme);
    document.querySelector('.theme-selector').value = savedTheme;

    const savedBanner = localStorage.getItem('mainBanner');
    if(savedBanner) document.getElementById('main-banner').style.backgroundImage = `url('${savedBanner}')`;

    // --- (1) 타이핑 인트로 로직 ---
    const introText = "> SYSTEM BOOTING...\n> CHECKING SYNCHRONIZATION RATE...\n> 98.7%... OK.\n> ACCESS GRANTED.\n\n> WELCOME TO THE ARCHIVE.";
    let charIndex = 0;
    let typingTimer;
    
    function typeEffect() {
        if (charIndex < introText.length) {
            document.getElementById('typing-text').textContent += introText.charAt(charIndex);
            charIndex++;
            typingTimer = setTimeout(typeEffect, 40);
        } else {
            setTimeout(skipIntro, 1500); // 다 치고 1.5초 후 메인으로
        }
    }

    function skipIntro() {
        clearTimeout(typingTimer);
        const intro = document.getElementById('intro-screen');
        intro.style.transition = "opacity 0.5s ease";
        intro.style.opacity = "0";
        setTimeout(() => {
            intro.style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            updateUIPermissions();
            renderPosts();
        }, 500);
    }

    // 페이지 로드 시 인트로 시작 (테스트 편의를 위해 매번 실행되도록 함)
    window.onload = typeEffect;


    // --- (3) 권한 및 로그인 로직 ---
    function updateUIPermissions() {
        const adminElements = document.querySelectorAll('.admin-only');
        const loginBtn = document.getElementById('login-btn');
        const accessLevel = document.getElementById('access-level-text');

        if (isLoggedIn) {
            adminElements.forEach(el => el.style.display = el.tagName === 'BUTTON' ? 'inline-block' : 'block');
            loginBtn.style.display = 'none';
            accessLevel.innerHTML = '<span style="color:#48bb78;">Admin (Full Access)</span>';
        } else {
            adminElements.forEach(el => el.style.display = 'none');
            loginBtn.style.display = 'inline-block';
            accessLevel.innerHTML = 'Guest (Read Only)';
        }
        renderPosts(); // 게시물 렌더링 시 수정/삭제 버튼 유무 업데이트
    }

    function openAuthModal(action) {
        currentAuthAction = action;
        document.getElementById('auth-pw-input').value = '';
        document.getElementById('auth-new-pw-input').value = '';
        
        if (action === 'login') {
            document.getElementById('auth-modal-title').innerText = '관리자 로그인';
            document.getElementById('auth-modal-desc').innerText = '글 작성 및 관리를 위해 비밀번호를 입력하세요.';
            document.getElementById('auth-new-pw-input').style.display = 'none';
        } else if (action === 'changePw') {
            document.getElementById('auth-modal-title').innerText = '비밀번호 변경';
            document.getElementById('auth-modal-desc').innerText = '현재 비밀번호와 새 비밀번호를 입력하세요.';
            document.getElementById('auth-new-pw-input').style.display = 'block';
        }
        document.getElementById('authModal').style.display = 'flex';
    }

    function executeAuth() {
        const inputPw = document.getElementById('auth-pw-input').value;
        const realPw = localStorage.getItem('masterPw');

        if (inputPw !== realPw) {
            alert('비밀번호가 일치하지 않습니다.');
            return;
        }

        if (currentAuthAction === 'login') {
            isLoggedIn = true;
            sessionStorage.setItem('isAdmin', 'true');
            updateUIPermissions();
            closeModal('authModal');
        } else if (currentAuthAction === 'changePw') {
            const newPw = document.getElementById('auth-new-pw-input').value;
            if(!newPw) { alert('새 비밀번호를 입력하세요.'); return; }
            localStorage.setItem('masterPw', newPw);
            alert('비밀번호가 변경되었습니다!');
            closeModal('authModal');
        }
    }

    function logout() {
        isLoggedIn = false;
        sessionStorage.removeItem('isAdmin');
        updateUIPermissions();
        alert('로그아웃 되었습니다. 읽기 전용 모드로 전환됩니다.');
    }


    // --- (4) 메인 사진 및 테마 커스텀 로직 ---
    function changeMainImagePrompt() {
        const url = prompt('새로운 메인 이미지의 URL(링크)을 입력하세요:\n(예: https://...)');
        if (url) {
            document.getElementById('main-banner').style.backgroundImage = `url('${url}')`;
            localStorage.setItem('mainBanner', url);
        }
    }

    function changeTheme(themeName) {
        document.body.setAttribute('data-theme', themeName);
        localStorage.setItem('siteTheme', themeName);
    }


    // --- (2) 게시판 (큰 창 글쓰기) CRUD 로직 ---
    function renderPosts() {
        const container = document.getElementById('post-container');
        container.innerHTML = '';

        if(posts.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding: 20px;">기록된 로그가 없습니다.</p>';
            return;
        }

        posts.slice().reverse().forEach(post => {
            const dateStr = new Date(post.date).toLocaleString();
            
            // 이미지가 없으면 텍스트만 꽉 차게, 이미지가 있으면 썸네일 표시
            const imgHtml = post.image ? `<img src="${post.image}" class="post-thumb" alt="thumb">` : '';
            
            // 로그인 상태일 때만 수정/삭제 버튼 표시
            const actionBtns = isLoggedIn ? `
                <div class="post-actions">
                    <button class="btn-small" onclick="openWriteScreen(${post.id})">수정</button>
                    <button class="btn-small" onclick="deletePost(${post.id})" style="color:#e53e3e; border-color:#e53e3e;">삭제</button>
                </div>
            ` : '';

            container.innerHTML += `
                <div class="post-item">
                    ${imgHtml}
                    <div class="post-content">
                        <h4 class="post-title">${post.title}</h4>
                        <p class="post-date">${dateStr}</p>
                        <p class="post-body">${post.content}</p>
                    </div>
                    ${actionBtns}
                </div>
            `;
        });
    }

    // 큰 창 열기 (새 글 or 수정)
    function openWriteScreen(id = null) {
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('write-screen').style.display = 'flex';
        
        // 입력 폼 초기화
        document.getElementById('post-image-file').value = '';
        document.getElementById('post-image-url').value = '';
        document.getElementById('post-image-data').value = '';
        
        if(id !== null) {
            const post = posts.find(p => p.id === id);
            document.getElementById('write-title').innerText = '로그 편집';
            document.getElementById('post-id').value = post.id;
            document.getElementById('post-title-input').value = post.title;
            document.getElementById('post-body-input').value = post.content;
            if(post.image) {
                document.getElementById('post-image-url').value = post.image;
                document.getElementById('post-image-data').value = post.image;
            }
        } else {
            document.getElementById('write-title').innerText = '새 로그 작성';
            document.getElementById('post-id').value = '';
            document.getElementById('post-title-input').value = '';
            document.getElementById('post-body-input').value = '';
        }
    }

    // 큰 창 닫기
    function closeWriteScreen() {
        document.getElementById('write-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
    }

    // 파일 로컬 미리보기 (Base64 변환 후 hidden input에 저장)
    function previewImage(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('post-image-data').value = e.target.result;
            document.getElementById('post-image-url').value = '로컬 파일 업로드됨';
        };
        reader.readAsDataURL(file);
    }

    function savePost() {
        const id = document.getElementById('post-id').value;
        const title = document.getElementById('post-title-input').value;
        const content = document.getElementById('post-body-input').value;
        const image = document.getElementById('post-image-data').value;

        if(!title || !content) { alert('제목과 내용을 모두 작성해주세요.'); return; }

        if(id) {
            const index = posts.findIndex(p => p.id === parseInt(id));
            posts[index].title = title;
            posts[index].content = content;
            posts[index].image = image; 
        } else {
            posts.push({
                id: Date.now(),
                title: title,
                content: content,
                image: image,
                date: new Date().toISOString()
            });
        }

        localStorage.setItem('sharedPosts', JSON.stringify(posts));
        closeWriteScreen();
        renderPosts();
    }

    function deletePost(id) {
        if(confirm('정말 이 로그를 영구 삭제하시겠습니까?')) {
            posts = posts.filter(p => p.id !== id);
            localStorage.setItem('sharedPosts', JSON.stringify(posts));
            renderPosts();
        }
    }

    function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
</script>
</body>
</html>
