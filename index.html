<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared Private Home</title>
<style>
    /* CSS: 기본 디자인 및 대시보드 레이아웃 (GIF 테마 참고) */
    :root {
        --bg-color: #f4f5f7;
        --card-bg: #ffffff;
        --text-main: #2d3748;
        --accent: #4a5568;
        --point-color: #ed8936;
    }
    body { margin: 0; padding: 20px; font-family: 'Pretendard', sans-serif; background: var(--bg-color); color: var(--text-main); }
    
    /* 로그인 화면 */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
    .input-box { padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; width: 250px; }
    .btn { padding: 10px 15px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
    .btn:hover { opacity: 0.8; }

    /* 대시보드 레이아웃 */
    #dashboard { display: none; max-width: 1000px; margin: 0 auto; gap: 20px; display: flex; flex-direction: column; }
    .header-widget { background: #1a202c; color: white; padding: 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
    
    /* BGM 플레이어 & 도구 모음 */
    .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    
    /* 게시판 */
    .post-list { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
    .post-item { border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; display: flex; gap: 15px; align-items: flex-start; }
    .post-thumb { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; background: #eee; }
    .post-content { flex: 1; }
    .post-actions { display: flex; gap: 5px; }
    .btn-small { padding: 5px 10px; font-size: 12px; cursor: pointer; border-radius: 3px; border: 1px solid #ccc; }

    /* 모달 (글쓰기/수정/비밀번호 변경) */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 30px; border-radius: 15px; width: 400px; display: flex; flex-direction: column; gap: 10px; }
    .modal-content input, .modal-content textarea { width: 100%; padding: 10px; box-sizing: border-box; }
</style>
</head>
<body>

<div id="login-screen">
    <h2>🔒 Private Area</h2>
    <input type="password" id="pw-input" class="input-box" placeholder="마스터 비밀번호 입력">
    <button class="btn" onclick="checkLogin()">Enter</button>
</div>

<div id="dashboard" style="display: none;">
    <div class="header-widget">
        <div>
            <h2 style="margin:0;">Resonance Status: Stable</h2>
            <p style="margin: 5px 0 0 0; color: #a0aec0;">Welcome to the shared space.</p>
        </div>
        <div>
            <button class="btn" onclick="openModal('pwModal')" style="background: #2d3748; border: 1px solid #4a5568;">비밀번호 변경</button>
            <button class="btn" onclick="logout()" style="background: #c53030;">로그아웃</button>
        </div>
    </div>

    <div class="tools-grid">
        <div class="card">
            <h3>🎵 Theme BGM</h3>
            <p id="bgm-title">기본 BGM (음원 파일을 연결해주세요)</p>
            <audio id="bgm-player" controls loop style="width: 100%;">
                <source src="YOUR_BGM_FILE_URL.mp3" type="audio/mpeg">
                브라우저가 오디오를 지원하지 않습니다.
            </audio>
        </div>
        
        <div class="card">
            <h3>👥 Synchronized Users</h3>
            <p>Member 1 | Member 2 | Member 3</p>
            <p style="font-size: 12px; color: #718096;">* 세 명의 사용자가 동일한 권한으로 관리합니다.</p>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>📝 Shared Logs</h3>
            <button class="btn" onclick="openPostModal()">새 글 작성</button>
        </div>
        <div id="post-container" class="post-list">
            </div>
    </div>
</div>

<div id="postModal" class="modal">
    <div class="modal-content">
        <h3 id="modal-title">새 글 작성</h3>
        <input type="hidden" id="post-id">
        <input type="text" id="post-title" placeholder="제목">
        <textarea id="post-body" rows="5" placeholder="내용을 입력하세요"></textarea>
        
        <label style="font-size: 12px; color: #4a5568;">대표 이미지 (URL 또는 Base64)</label>
        <input type="file" id="post-image" accept="image/*" onchange="previewImage(event)">
        <input type="hidden" id="post-image-data">
        
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn" style="flex: 1;" onclick="savePost()">저장</button>
            <button class="btn" style="flex: 1; background: #a0aec0;" onclick="closeModal('postModal')">취소</button>
        </div>
    </div>
</div>

<div id="pwModal" class="modal">
    <div class="modal-content">
        <h3>비밀번호 변경</h3>
        <input type="password" id="new-pw" placeholder="새로운 마스터 비밀번호">
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn" style="flex: 1;" onclick="changePassword()">변경하기</button>
            <button class="btn" style="flex: 1; background: #a0aec0;" onclick="closeModal('pwModal')">취소</button>
        </div>
    </div>
</div>

<script>
    // --- 1. 상태 및 비밀번호 관리 (로컬 스토리지 사용) ---
    // 기본 비밀번호는 '1234'로 설정해두었습니다. (첫 접속 시)
    if(!localStorage.getItem('masterPw')) {
        localStorage.setItem('masterPw', '1234'); 
    }
    
    let posts = JSON.parse(localStorage.getItem('sharedPosts')) || [];

    // --- 로그인 로직 ---
    function checkLogin() {
        const input = document.getElementById('pw-input').value;
        const currentPw = localStorage.getItem('masterPw');
        
        if(input === currentPw) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            document.getElementById('pw-input').value = '';
            renderPosts();
        } else {
            alert('비밀번호가 일치하지 않습니다.');
        }
    }

    function logout() {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
        
        // 오디오 정지
        const bgm = document.getElementById('bgm-player');
        bgm.pause();
        bgm.currentTime = 0;
    }

    // --- 비밀번호 변경 로직 ---
    function changePassword() {
        const newPw = document.getElementById('new-pw').value;
        if(newPw.trim() === '') {
            alert('비밀번호를 입력해주세요.'); return;
        }
        localStorage.setItem('masterPw', newPw);
        alert('비밀번호가 변경되었습니다. 3명 모두에게 새 비밀번호를 공유해주세요!');
        closeModal('pwModal');
        document.getElementById('new-pw').value = '';
    }

    // --- 게시판 CRUD 로직 ---
    function renderPosts() {
        const container = document.getElementById('post-container');
        container.innerHTML = '';

        if(posts.length === 0) {
            container.innerHTML = '<p style="color:#a0aec0; text-align:center;">등록된 로그가 없습니다.</p>';
            return;
        }

        // 최신 글이 위로 오게 역순 렌더링
        posts.slice().reverse().forEach(post => {
            const dateStr = new Date(post.date).toLocaleString();
            const imgHtml = post.image ? `<img src="${post.image}" class="post-thumb" alt="대표 이미지">` : `<div class="post-thumb" style="display:flex; align-items:center; justify-content:center; font-size:12px; color:#aaa;">No Img</div>`;
            
            container.innerHTML += `
                <div class="post-item">
                    ${imgHtml}
                    <div class="post-content">
                        <h4 style="margin:0 0 5px 0;">${post.title}</h4>
                        <p style="font-size:12px; color:#718096; margin:0 0 10px 0;">${dateStr}</p>
                        <p style="margin:0; font-size:14px; white-space: pre-wrap;">${post.content}</p>
                    </div>
                    <div class="post-actions">
                        <button class="btn-small" onclick="editPost(${post.id})">수정</button>
                        <button class="btn-small" onclick="deletePost(${post.id})" style="color:red; border-color:red;">삭제</button>
                    </div>
                </div>
            `;
        });
    }

    // 이미지 파일 로컬 미리보기 (Base64 변환)
    function previewImage(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('post-image-data').value = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function openPostModal(id = null) {
        document.getElementById('post-image-data').value = '';
        document.getElementById('post-image').value = '';
        
        if(id !== null) {
            // 수정 모드
            const post = posts.find(p => p.id === id);
            document.getElementById('modal-title').innerText = '글 수정';
            document.getElementById('post-id').value = post.id;
            document.getElementById('post-title').value = post.title;
            document.getElementById('post-body').value = post.content;
            document.getElementById('post-image-data').value = post.image || '';
        } else {
            // 새 글 모드
            document.getElementById('modal-title').innerText = '새 글 작성';
            document.getElementById('post-id').value = '';
            document.getElementById('post-title').value = '';
            document.getElementById('post-body').value = '';
        }
        openModal('postModal');
    }

    function savePost() {
        const id = document.getElementById('post-id').value;
        const title = document.getElementById('post-title').value;
        const content = document.getElementById('post-body').value;
        const image = document.getElementById('post-image-data').value;

        if(!title || !content) { alert('제목과 내용을 입력하세요.'); return; }

        if(id) { // 수정
            const index = posts.findIndex(p => p.id === parseInt(id));
            posts[index].title = title;
            posts[index].content = content;
            if(image) posts[index].image = image; 
        } else { // 새 글
            const newPost = {
                id: Date.now(),
                title: title,
                content: content,
                image: image,
                date: new Date().toISOString()
            };
            posts.push(newPost);
        }

        // 로컬 스토리지에 저장 (DB 역할)
        localStorage.setItem('sharedPosts', JSON.stringify(posts));
        closeModal('postModal');
        renderPosts();
    }

    function deletePost(id) {
        if(confirm('정말 이 로그를 삭제하시겠습니까?')) {
            posts = posts.filter(p => p.id !== id);
            localStorage.setItem('sharedPosts', JSON.stringify(posts));
            renderPosts();
        }
    }

    // --- 유틸 함수 ---
    function openModal(modalId) { document.getElementById(modalId).style.display = 'flex'; }
    function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
</script>
</body>
</html>
